name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # macOS: the optional automation layer drives launchd and shells out to
    # `launchctl` and `plutil`, so the doctor tests only make sense here. The
    # core (store, service, MCP server, recall) is platform-independent —
    # gating those tests by platform is what a Linux job is waiting on.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        # Hermetic: every case builds its own sandbox workspace and SQLite file
        # under tmp_path. No network, no Ollama, no Mem0 — the optional bridge
        # tests skip when that operator tooling is absent.
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Verify installed wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/chronicle-wheel"
          "$RUNNER_TEMP/chronicle-wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/chronicle-wheel/bin/chronicle" init --root "$RUNNER_TEMP/memory"
          "$RUNNER_TEMP/chronicle-wheel/bin/chronicle" --help
      - name: Round trip through the installed wheel
        # Record, recall, then serve: the installed package (not the checkout)
        # answers /health, the brief and the web view over HTTP.
        env:
          CHRONICLE_FEATURE_EVENT_EMBEDDINGS: "0"
        run: |
          bin="$RUNNER_TEMP/chronicle-wheel/bin"
          export CHRONICLE_ROOT="$RUNNER_TEMP/memory"
          cd "$RUNNER_TEMP"
          "$bin/chronicle" record "Smoke test decision" --project demo --task-id smoke \
            --agent ci --category decision --why "wheel check" > /dev/null
          "$bin/chronicle" query-memory "smoke test" --project demo --format json \
            | "$bin/python" -c "import json, sys; assert json.load(sys.stdin)['results'], 'recall found nothing'"
          MCP_HOST=127.0.0.1 MCP_PORT=18093 "$bin/chronicle-mcp" --transport streamable-http --migrate \
            > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat "$RUNNER_TEMP/server.log"' EXIT
          for _ in $(seq 1 60); do curl -fsS -m 2 http://127.0.0.1:18093/health > /dev/null 2>&1 && break; sleep 1; done
          curl -fsS -m 5 http://127.0.0.1:18093/health
          curl -fsS -m 5 "http://127.0.0.1:18093/brief?project=demo" | grep -q "Smoke test decision"
          curl -fsS -m 10 http://127.0.0.1:18093/ui | grep -q "Smoke test decision"
          # The Atlas ships its page and scripts in the wheel, and maps the record.
          curl -fsS -m 5 http://127.0.0.1:18093/ui/atlas | grep -q "/ui/static/atlas/main.js"
          for file in main.js render.js layout.worker.js timeline.js panel.js atlas.css; do
            curl -fsS -m 5 -o /dev/null "http://127.0.0.1:18093/ui/static/atlas/$file"
          done
          curl -fsS -m 10 -o "$RUNNER_TEMP/atlas.json" http://127.0.0.1:18093/ui/api/atlas
          grep -q "Smoke test decision" "$RUNNER_TEMP/atlas.json"
